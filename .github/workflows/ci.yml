name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[dev]' build 'semgrep==1.177.0'
          npm ci --prefix sdk/typescript
      - name: TypeScript tests and build
        run: npm test --prefix sdk/typescript
      - name: Python tests including Observer parity
        # Tests use fixtures and mock runners, never paid models. Tests requiring
        # external harness checkouts or preserved private bundles report skips.
        run: python -m pytest -q -rs
      - name: Build wheel
        run: python -m build --wheel --outdir "$RUNNER_TEMP/scaneval-dist"
      - name: Installed-wheel demo and replay
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: |
          python -m venv "$RUNNER_TEMP/scaneval-wheel-env"
          "$RUNNER_TEMP/scaneval-wheel-env/bin/python" -m pip install "$RUNNER_TEMP"/scaneval-dist/*.whl
          "$RUNNER_TEMP/scaneval-wheel-env/bin/scaneval" demo "$RUNNER_TEMP/scaneval-demo"
          "$RUNNER_TEMP/scaneval-wheel-env/bin/scaneval" replay "$RUNNER_TEMP/scaneval-demo" --output "$RUNNER_TEMP/scaneval-replay.json"
          cmp "$RUNNER_TEMP/scaneval-demo/evaluation.json" "$RUNNER_TEMP/scaneval-replay.json"

  oci_path_gate:
    name: Decide whether OCI integration is relevant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_oci: ${{ steps.filter.outputs.run_oci }}
    steps:
      # pull_request checks out GitHub's merge ref. Depth two contains the merge commit and its
      # base parent, so HEAD^..HEAD is the complete PR change, not merely its last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match OCI-relevant paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          decision="$(python3 scripts/oci_ci_path_gate.py --event-name "$EVENT_NAME")"
          case "$decision" in
            true|false) ;;
            *) echo "OCI path gate returned an invalid decision: $decision" >&2; exit 1 ;;
          esac
          echo "run_oci=$decision" >> "$GITHUB_OUTPUT"

  oci-integration:
    name: OCI backend against a real Docker engine
    needs: oci_path_gate
    # A failed filter must surface as a failed required check, never as a silently skipped Docker
    # run. Pushes to main and workflow_dispatch return true without consulting the diff.
    if: ${{ always() && (needs.oci_path_gate.result != 'success' || needs.oci_path_gate.outputs.run_oci != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Without this the module skips when no engine or image is present; here that is a failure.
      SCANEVAL_REQUIRE_DOCKER: '1'
    steps:
      - name: Require a successful path decision
        if: ${{ needs.oci_path_gate.result != 'success' }}
        run: |
          echo "The OCI path gate failed; refusing to hide the Docker check." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Describe the engine
        # model_provider_only needs an engine that applies gateway_mode_ipv4=isolated; the record
        # of which engine ran is here when that test says it did not.
        run: |
          docker version
          docker info
      - name: Pull the pinned images
        # The backend never pulls an image, so the tests use only what is already present.
        run: |
          docker pull python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          docker pull semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
      - name: OCI integration tests
        # Real containers, local fixture services, and benign example.com retrieval; no model
        # or target application is called. Native Linux also checks cross-UID capture reads.
        run: python -m pytest -q -rs tests/test_v2_isolation_docker.py tests/test_v2_open_context_docker.py
