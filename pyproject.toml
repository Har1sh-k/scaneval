[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sastbench"
version = "2.0.0a1"
description = "Reproducible evaluation and observability contracts for security scanners."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "SASTbench contributors" },
]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
sastbench = "sastbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sastbench = ["schemas/*.json", "mappings/*.json"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
official-adapters = [
  "bandit>=1.7.8",
  "semgrep>=1.77.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
  ".git",
  ".repos",
  ".venv",
  "cases",
  "results",
]
