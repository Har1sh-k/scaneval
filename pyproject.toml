[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaneval"
version = "2.0.0a1"
description = "Reproducible evaluation and observability contracts for security scanners."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ScanEval contributors" },
]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
scaneval = "scaneval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scaneval = ["schemas/*.json", "mappings/*.json", "adapters/*.mts"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # The YAML readers the blinding tests compare the YAML subset with. Test-only: src/ never imports them.
  "PyYAML>=6.0",
  "ruamel.yaml>=0.18",
]
official-adapters = [
  "semgrep>=1.77.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
  ".git",
  ".repos",
  ".venv",
  "cases",
  "results",
]
